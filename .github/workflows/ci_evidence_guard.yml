# CI Evidence Guard — the enforcement arm of ADR-0305 (OP-101).
#
# Why this workflow exists
# ------------------------
# GitHub creates NO `pull_request` workflow run while a PR has a merge
# conflict. The GitHub Actions documentation says so plainly: "Workflows won't
# run on pull requests that have a merge conflict." `CI`
# (.github/workflows/ci.yml) and `PR Checks` (.github/workflows/pr_checks.yml)
# both trigger on `pull_request`, so a lane head whose PR conflicts with `main`
# gets no run at all. The only checks that remain are CodeQL *default setup*
# runs (`event=dynamic`, push-triggered and therefore not conflict-suppressed),
# so the head shows a fully green check rollup although the suite never ran —
# and `main` has no required status checks to catch that. Each of the eight
# closed OP-101 draft branches demonstrated exactly this failure mode, every one
# of them conflicting on `docs/adr/README.md`.
#
# What this workflow does
# -----------------------
# It triggers on `push` (with `branches-ignore: [main]`) — the one trigger
# proved not to be conflict-suppressed — and, looking at the pushed head SHA:
#   1. finds the open PR whose head is that SHA (no open PR is an ordinary
#      branch push, so it exits 0);
#   2. fails with an `::error::` annotation when that PR is conflicting with its
#      base (`mergeable == false` / `mergeable_state == "dirty"`), because in
#      that state `CI` and `PR Checks` have provably not run;
#   3. belt-and-braces, fails when the PR is mergeable but neither a `CI` nor a
#      `PR Checks` run exists for the head SHA (a brief poll absorbs the race
#      with the runs a push just created).
#
# Safety
# ------
# This job only reads the GitHub API. It checks out no code, executes nothing
# from the head branch, and holds no write scope or secret beyond the
# read-scoped, auto-provided `GITHUB_TOKEN`. Every `${{ … }}` context is handed
# to the shell through the step `env:` map, never interpolated into `run:` text,
# so no attacker-controllable value can reach the command line (the rule the
# `workflow-shell-safety` guard enforces).
name: CI Evidence Guard

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  ci-evidence:
    name: Assert CI evidence for the pushed head
    runs-on: ubuntu-latest
    steps:
      - name: Assert the head PR is mergeable and CI/PR Checks have run
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          api() {
            curl -sS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$1"
          }

          # 1. The open PR (if any) whose head is this SHA.
          PRS=$(api "https://api.github.com/repos/$REPO/commits/$SHA/pulls")
          PR_COUNT=$(printf '%s' "$PRS" | jq 'length')
          if [ "$PR_COUNT" -eq 0 ]; then
            echo "No open PR for $SHA — ordinary branch push, no CI expected."
            exit 0
          fi

          PR_NUMBER=$(printf '%s' "$PRS" | jq -r '.[0].number')
          BASE_REF=$(printf '%s' "$PRS" | jq -r '.[0].base.ref')

          # 2. Conflict assertion. `mergeable` is null while GitHub is still
          #    computing it, so re-query a few times and only conclude once it is
          #    a boolean — never fail on null.
          MERGEABLE=""
          MERGEABLE_STATE=""
          for _attempt in 1 2 3 4 5; do
            PR_JSON=$(api "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER")
            MERGEABLE=$(printf '%s' "$PR_JSON" | jq -r '.mergeable')
            MERGEABLE_STATE=$(printf '%s' "$PR_JSON" | jq -r '.mergeable_state')
            if [ "$MERGEABLE" = "true" ] || [ "$MERGEABLE" = "false" ]; then
              break
            fi
            sleep 3
          done

          if [ "$MERGEABLE" = "false" ] || [ "$MERGEABLE_STATE" = "dirty" ]; then
            echo "::error::PR #$PR_NUMBER (head $SHA) conflicts with $BASE_REF. GitHub suppresses pull_request workflow runs while a PR has a merge conflict, so CI and PR Checks have NOT run on this head. Run 'git merge origin/main' in the lane worktree, resolve the conflict, and push to re-trigger CI."
            exit 1
          fi

          # 3. Belt-and-braces absence check. With the PR mergeable, require a
          #    run of workflow `CI` and of workflow `PR Checks` with this head
          #    SHA. Poll briefly so we do not race the runs a push just created.
          for _attempt in 1 2 3 4 5 6; do
            RUNS=$(api "https://api.github.com/repos/$REPO/actions/runs?head_sha=$SHA&per_page=100")
            MISSING=""
            for WORKFLOW in "CI" "PR Checks"; do
              if ! printf '%s' "$RUNS" \
                | jq -e --arg wf "$WORKFLOW" '.workflow_runs[] | select(.name == $wf)' >/dev/null; then
                MISSING="$MISSING $WORKFLOW"
              fi
            done
            if [ -z "$MISSING" ]; then
              echo "CI and PR Checks have runs for $SHA (PR #$PR_NUMBER)."
              exit 0
            fi
            sleep 10
          done

          echo "::error::No CI / PR Checks run found for head $SHA (PR #$PR_NUMBER): CI has not run on this head. Push again or re-run the workflows."
          exit 1
