name: Production Failure Notifier

on:
  repository_dispatch:
    types: [prod-deploy-failed]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord alert
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
        run: |
          PAYLOAD=$(jq -n \
            --arg url "https://github.com/${REPO}/deployments" \
            --arg repo "$REPO" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              embeds: [{
                title: "🚨 Production Deployment Failed",
                url: $url,
                description: "The latest Vercel production deployment failed and is still unresolved.\nThis alert repeats every 15 minutes until a deployment succeeds.\n\n[View Deployments](\($url))",
                color: 15548997,
                footer: { text: $repo },
                timestamp: $ts
              }]
            }')

          curl -sS --fail \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"
