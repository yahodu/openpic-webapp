name: Vercel Production Deploy Monitor

on:
  deployment_status:

permissions:
  contents: read

jobs:
  handle-failure:
    if: |
      github.event.deployment_status.state == 'failure' &&
      github.event.deployment_status.environment == 'Production'

    runs-on: ubuntu-latest

    steps:
      - name: Send immediate Discord failure alert
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.deployment.sha }}
          TARGET_URL: ${{ github.event.deployment_status.target_url }}
        run: |
          DEPLOYMENTS_URL="https://github.com/${REPO}/deployments"
          LINK="${TARGET_URL:-$DEPLOYMENTS_URL}"

          PAYLOAD=$(jq -n \
            --arg url "$DEPLOYMENTS_URL" \
            --arg link "$LINK" \
            --arg sha "${SHA:0:7}" \
            --arg repo "$REPO" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              embeds: [{
                title: "🚨 Production Deployment Failed",
                url: $url,
                description: "A Vercel production deployment has just failed.\nYou will get a reminder every 15 minutes until a deployment succeeds.\n\n[View Deployment](\($link))",
                color: 15548997,
                fields: [
                  { name: "Commit", value: ("`" + $sha + "`"), inline: true },
                  { name: "Environment", value: "Production", inline: true }
                ],
                footer: { text: $repo },
                timestamp: $ts
              }]
            }')

          curl -sS --fail \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"

      - name: Create cron job on cron-job.org
        run: |
          # Clean up any existing job with the same name (idempotency)
          JOBS=$(curl -s -X GET "https://api.cron-job.org/jobs" \
            -H "Authorization: Bearer ${{ secrets.CRON_JOB_ORG_API_KEY }}" \
            -H "Content-Type: application/json")

          EXISTING_ID=$(echo "$JOBS" | jq -r '
            .jobs[] | select(.title == "vercel-prod-failure-notifier-job") | .jobId
          ' | head -n 1)

          if [ -n "$EXISTING_ID" ]; then
            curl -s -X DELETE "https://api.cron-job.org/jobs/$EXISTING_ID" \
              -H "Authorization: Bearer ${{ secrets.CRON_JOB_ORG_API_KEY }}" \
              -H "Content-Type: application/json"
            echo "Deleted stale cron job: $EXISTING_ID"
          fi

          # Create new cron job (every 15 min, runs until deleted by success handler)
          curl -s -X PUT "https://api.cron-job.org/jobs" \
            -H "Authorization: Bearer ${{ secrets.CRON_JOB_ORG_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "job": {
                "title": "vercel-prod-failure-notifier-job",
                "url": "https://api.github.com/repos/${{ github.repository }}/dispatches",
                "enabled": true,
                "saveResponses": true,
                "requestMethod": 1,
                "extendedData": {
                  "headers": {
                    "Authorization": "Bearer ${{ secrets.GH_PAT }}",
                    "Accept": "application/vnd.github+json",
                    "Content-Type": "application/json"
                  },
                  "body": "{\"event_type\": \"prod-deploy-failed\"}"
                },
                "schedule": {
                  "timezone": "Asia/Kolkata",
                  "expiresAt": 0,
                  "hours": [-1],
                  "mdays": [-1],
                  "months": [-1],
                  "wdays": [-1],
                  "minutes": [0, 15, 30, 45]
                }
              }
            }'
          echo "Cron job created."

  handle-success:
    if: |
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'Production'

    runs-on: ubuntu-latest

    steps:
      - name: Send immediate Discord success alert
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.deployment.sha }}
          TARGET_URL: ${{ github.event.deployment_status.target_url }}
        run: |
          DEPLOYMENTS_URL="https://github.com/${REPO}/deployments"
          LINK="${TARGET_URL:-$DEPLOYMENTS_URL}"

          PAYLOAD=$(jq -n \
            --arg url "$DEPLOYMENTS_URL" \
            --arg link "$LINK" \
            --arg sha "${SHA:0:7}" \
            --arg repo "$REPO" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              embeds: [{
                title: "✅ Production Deployment Succeeded",
                url: $url,
                description: "A Vercel production deployment has completed successfully.\nFailure reminders have been stopped.\n\n[View Deployment](\($link))",
                color: 5763719,
                fields: [
                  { name: "Commit", value: ("`" + $sha + "`"), inline: true },
                  { name: "Environment", value: "Production", inline: true }
                ],
                footer: { text: $repo },
                timestamp: $ts
              }]
            }')

          curl -sS --fail \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"

      - name: Delete cron job from cron-job.org
        run: |
          JOBS=$(curl -s -X GET "https://api.cron-job.org/jobs" \
            -H "Authorization: Bearer ${{ secrets.CRON_JOB_ORG_API_KEY }}" \
            -H "Content-Type: application/json")

          # Delete ALL jobs matching the name (handles duplicates safely)
          JOB_IDS=$(echo "$JOBS" | jq -r '
            .jobs[] | select(.title == "vercel-prod-failure-notifier-job") | .jobId
          ')

          if [ -z "$JOB_IDS" ]; then
            echo "No cron job found to delete. Nothing to do."
            exit 0
          fi

          for ID in $JOB_IDS; do
            curl -s -X DELETE "https://api.cron-job.org/jobs/$ID" \
              -H "Authorization: Bearer ${{ secrets.CRON_JOB_ORG_API_KEY }}" \
              -H "Content-Type: application/json"
            echo "Deleted cron job: $ID"
          done
