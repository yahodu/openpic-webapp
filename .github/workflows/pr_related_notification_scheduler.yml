name: PR Status Notifier

on:
  repository_dispatch:
    types: [pr-status-check]
  workflow_dispatch:

jobs:
  notify-pr-status:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: read
      checks: read

    steps:
      - name: Check PRs and notify Discord
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // ── Fetch all open, non-draft PRs ──────────────────────────────
            const { data: pullRequests } = await github.rest.pulls.list({
              owner, repo, state: 'open', per_page: 100,
            });

            const readyPRs = pullRequests.filter(pr => !pr.draft);
            console.log(`Found ${readyPRs.length} ready (non-draft) PRs`);

            // Buckets
            const conflictPRs           = [];  // Priority 1: has merge conflicts
            const unresolvedCommentsPRs = [];  // Priority 2: has unresolved comments
            const failedChecksPRs       = [];  // Priority 3: has failed checks
            const readyToMergePRs       = [];  // Priority 4: all green, ready to merge

            for (const pr of readyPRs) {
              const sha = pr.head.sha;

              // ── 1. Check for merge conflicts ─────────────────────────────
              const { data: prDetail } = await github.rest.pulls.get({
                owner, repo, pull_number: pr.number,
              });

              if (prDetail.mergeable === false) {
                conflictPRs.push({ pr: prDetail });
                continue;
              }

              // ── 2. Get unresolved review comments ────────────────────────
              const { data: reviews } = await github.rest.pulls.listReviews({
                owner, repo, pull_number: pr.number, per_page: 100,
              });

              const { data: reviewComments } = await github.rest.pulls.listReviewComments({
                owner, repo, pull_number: pr.number, per_page: 100,
              });

              const latestReviewByUser = {};
              for (const review of reviews) {
                if (['APPROVED', 'CHANGES_REQUESTED'].includes(review.state)) {
                  latestReviewByUser[review.user.login] = review.state;
                }
              }

              const requestChangesReviewers = Object.entries(latestReviewByUser)
                .filter(([, state]) => state === 'CHANGES_REQUESTED')
                .map(([user]) => user);

              const rootComments = reviewComments.filter(c => !c.in_reply_to_id);
              const replies = reviewComments.filter(c => c.in_reply_to_id);
              const repliedRootIds = new Set(replies.map(r => r.in_reply_to_id));
              const unresolvedThreadCount = rootComments.filter(
                c => !repliedRootIds.has(c.id)
              ).length;

              const hasUnresolved =
                requestChangesReviewers.length > 0 || unresolvedThreadCount > 0;

              if (hasUnresolved) {
                unresolvedCommentsPRs.push({
                  pr,
                  requestChangesReviewers,
                  unresolvedThreadCount,
                });
                continue;
              }

              // ── 3. Get check runs ────────────────────────────────────────
              const { data: checkRunsData } = await github.rest.checks.listForRef({
                owner, repo, ref: sha, per_page: 100,
              });

              const allRuns = checkRunsData.check_runs;
              const failedChecks = allRuns.filter(
                run =>
                  run.status === 'completed' &&
                  ['failure', 'timed_out', 'cancelled'].includes(run.conclusion)
              );
              const pendingChecks = allRuns.filter(run => run.status !== 'completed');

              if (failedChecks.length > 0) {
                failedChecksPRs.push({ pr, failedChecks });
                continue;
              }

              if (pendingChecks.length > 0) {
                continue;  // checks still running — ignore this PR entirely
              }

              // ── 4. Ready to merge ────────────────────────────────────────
              const approvals = Object.values(latestReviewByUser).filter(
                s => s === 'APPROVED'
              ).length;
              readyToMergePRs.push({ pr, approvals });
            }

            // ── Build Discord message ───────────────────────────────────────
            const hasAnything =
              conflictPRs.length > 0 ||
              unresolvedCommentsPRs.length > 0 ||
              failedChecksPRs.length > 0 ||
              readyToMergePRs.length > 0;

            if (!hasAnything) {
              console.log('Nothing to report. No Discord message sent.');
              return;
            }

            // Discord limits: 4096 chars/description, 6000 chars total per message.
            // Keep each section's description short so 5 embeds stay under the total.
            const MAX_DESC = 1300;

            const esc = (s) => String(s).replace(/([\\\[\]*_`~|>])/g, '\\$1');
            const prLink = (pr) => `**[#${pr.number} ${esc(pr.title)}](${pr.html_url})**`;

            const buildEmbed = (title, color, entries) => {
              let desc = '';
              let shown = 0;
              for (const entry of entries) {
                const next = (desc ? '\n\n' : '') + entry;
                if (desc.length + next.length > MAX_DESC) break;
                desc += next;
                shown++;
              }
              if (shown === 0) {
                desc = entries[0].slice(0, MAX_DESC) + '…';
                shown = 1;
              }
              if (shown < entries.length) {
                desc += `\n\n*…and ${entries.length - shown} more*`;
              }
              return { title: `${title} (${entries.length})`, description: desc, color };
            };

            const now = new Date();
            const when = now.toLocaleString('en-IN', {
              timeZone: 'Asia/Kolkata', dateStyle: 'medium', timeStyle: 'short',
            });

            const embeds = [
              {
                title: '📋 PR Status Report',
                description: `**${owner}/${repo}**  •  ${when} IST`,
                color: 5793266,  // blurple
                timestamp: now.toISOString(),
              },
            ];

            // ── Section 1: Merge Conflicts ───────────────────────────────
            if (conflictPRs.length > 0) {
              embeds.push(buildEmbed('🔀 Merge Conflicts', 15105570, conflictPRs.map(({ pr }) => [
                prLink(pr),
                `👤 ${pr.user.login}  •  Base: \`${pr.base.ref}\``,
                `⚠️ Conflicts with \`${pr.base.ref}\` — resolve before merging`,
              ].join('\n'))));
            }

            // ── Section 2: Unresolved Comments ───────────────────────────
            if (unresolvedCommentsPRs.length > 0) {
              embeds.push(buildEmbed('💬 Unresolved Comments', 16705372,
                unresolvedCommentsPRs.map(({ pr, requestChangesReviewers, unresolvedThreadCount }) => {
                  const lines = [prLink(pr), `👤 ${pr.user.login}`];
                  if (requestChangesReviewers.length > 0) {
                    lines.push(`🔁 Changes requested by: ${requestChangesReviewers.map(u => `\`${u}\``).join(', ')}`);
                  }
                  if (unresolvedThreadCount > 0) {
                    lines.push(`💬 ${unresolvedThreadCount} unresolved comment thread(s)`);
                  }
                  return lines.join('\n');
                })));
            }

            // ── Section 3: Failed Checks ─────────────────────────────────
            if (failedChecksPRs.length > 0) {
              embeds.push(buildEmbed('🔴 Failed Checks', 15548997, failedChecksPRs.map(({ pr, failedChecks }) => {
                const MAX_CHECKS = 5;
                const checkList = failedChecks.slice(0, MAX_CHECKS).map(c => {
                  const icon =
                    c.conclusion === 'failure'   ? '❌' :
                    c.conclusion === 'timed_out' ? '⏱️' : '🚫';
                  return `${icon} [${esc(c.name)}](${c.html_url})`;
                }).join('  ·  ');
                const extra = failedChecks.length > MAX_CHECKS
                  ? `  ·  +${failedChecks.length - MAX_CHECKS} more` : '';
                return [prLink(pr), `👤 ${pr.user.login}`, `Failed: ${checkList}${extra}`].join('\n');
              })));
            }

            // ── Section 4: Ready to Merge ────────────────────────────────
            if (readyToMergePRs.length > 0) {
              embeds.push(buildEmbed('✅ Ready to Merge', 5763719, readyToMergePRs.map(({ pr, approvals }) => [
                prLink(pr),
                `👤 ${pr.user.login}  •  ✔️ ${approvals} approval(s)  •  All checks passed`,
              ].join('\n'))));
            }

            // ── Send to Discord ───────────────────────────────────────────
            const webhookUrl = process.env.DISCORD_WEBHOOK_URL;
            const res = await fetch(webhookUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ embeds }),
            });

            if (!res.ok) {
              throw new Error(`Discord webhook failed: ${res.status} ${await res.text()}`);
            }

            console.log('Discord notified:', {
              conflicts: conflictPRs.length,
              unresolvedComments: unresolvedCommentsPRs.length,
              failedChecks: failedChecksPRs.length,
              readyToMerge: readyToMergePRs.length,
            });
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
