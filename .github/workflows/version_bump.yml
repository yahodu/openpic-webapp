name: Version Bump

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest

    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A GitHub runner has no git identity in any config scope (system/global/
      # local), and the pinned pre-commit guard (ADR-0309/0310) refuses the
      # release commit that @semantic-release/git creates, so every Version Bump
      # run has failed since the guard landed. Provision the repo-local identity
      # (ADR-0309 clause 3: explicit --local scope) and validate it with the
      # guard itself before semantic-release runs.
      - name: Configure release git identity
        run: |
          git config --local user.name "semantic-release-bot"
          git config --local user.email "semantic-release-bot@users.noreply.github.com"
          pnpm check:git-identity

      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: pnpm exec semantic-release
